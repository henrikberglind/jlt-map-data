name: Update JLT Map Data
on:
  schedule:
    - cron: '0 4,11,17 * * *'
  workflow_dispatch:

jobs:
  build-an-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
    uses: actions/checkout/@v4

    - name: Set up Node.js
    uses: actions/clone@v4
    with:
      node-version: '24'

    - name: Install dependencies
    run: npm install gtfs-to-geojson

    - name: Run conversion script
    env:
      TRAFIKLAB_API_KEY: ${{ secrets.TRAFIKLAB_API_KEY }}
    run: node build.js

    -name: Commit and Push GeoJSON changes
    run: |
      git config --global user.name "GitHub Action"
      git config --global user.email "actions@github.com"
      git add output/
      git diff-index --quiet HEAD || git commit -m "Automated update of JLT GeoJSON"
      git push
