name: Update JLT Map Data

on:
  schedule:
    - cron: '0 4,11,17 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download GTFS File
        env:
          TRAFIKLAB_API_KEY: ${{ secrets.TRAFIKLAB_API_KEY }}
        run: node download.js

      - name: Run GTFS to GeoJSON Conversion
        run: npx gtfs-to-geojson --configPath config.json

      - name: Rename GeoJSON file to a short name
        run: |
          # Aktivera sökning i undermappar
          shopt -s globstar
          
          # Skapa en garanterad slutmapp för ditt resultat
          mkdir -p final_output
          
          # Hitta .geojson-filen var den än skapades (geojson/ eller output/) och flytta den
          if mv **/*.geojson final_output/jlt.geojson 2>/dev/null; then
            echo "Lyckades hitta och flytta GeoJSON-filen!"
          else
            echo "Fel: Hittade ingen genererad GeoJSON-fil över huvud taget."
            echo "=== Visar alla filer i katalogen för felsökning ==="
            ls -R
            exit 1
          fi
          
          # Rensa upp eventuella tomma genererade mappar så de inte checkas in
          rm -rf geojson output

      - name: Commit and Push GeoJSON changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Automated update of JLT GeoJSON with short filename"
          git push
